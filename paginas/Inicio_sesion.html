<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria's Garden</title>
    <link rel="stylesheet" href="../activos/css/style.css">
</head>

<body>
    <header>

        <nav class="navbar">
            <div class="logo">
                <img src="../activos/imagenes/Navbar/logo.png" alt="Valeria's Garden" class="nav_icon">
            </div>

            <ul class="nav_centro">
                <li><a href="Publicaciones.html" title="Home">
                        <img src="../activos/imagenes/Navbar/inicio.png" alt="Home" class="nav_icon">
                    </a>
                </li>
                <li><a href="Crear_publicacion.html" title="Crear">
                        <img src="../activos/imagenes/Navbar/crear.png" alt="Crear" class="nav_icon">
                    </a>
                </li>
                <li><a href="Buscar.html" title="Buscar">
                        <img src="../activos/imagenes/Navbar/buscar.png" alt="Buscar" class="nav_icon">
                    </a>
                </li>
            </ul>

            <div class="perfil">
                <a href="Perfil_usuario.html" title="Perfil">
                    <img src="../activos/imagenes/Navbar/perfil.png" alt="Foto de perfil" class="nav_icon">
                </a>
            </div>
        </nav>

    </header>
 
    <!-- Parte Principal -->
    <main>
 
    <!-- Formulario de inicio de sesión -->
        <section class="Caja1_form">
        <div class="Datos_personales">
 
            <h2>¡Foto de perfil!</h2>
            <br>
            <img src="../activos/imagenes/Navbar/perfil.png" alt="Foto de perfil" class="fotoForm">
 
            <form class="form1">
 
                <p><label for="nombre">¿Cómo quiere que lo conozcan?:
                <input type="text" placeholder="Nombre de usuario" name="nombre" required></label></p>
 
                <p><label for="correo">¿Qué correo desea usar?:
                <input type="email" placeholder="correo@gmail.com" name="correo" required></label>
 
                <p><label for="pais">¿Cuál es su país de origen?:</label></p>
                <select name="pais" required>
                    <option value="costaRica">Costa Rica</option>
                    <option value="belice">Belice</option>
                    <option value="elSalvador">El Salvador</option>
                    <option value="guatemala">Guatemala</option>
                    <option value="honduras">Honduras</option>
                    <option value="nicaragua">Nicaragua</option>
                    <option value="panama">Panamá</option>
                </select>
 
                <p><label for="provincia">¿En qué provincia vive?:</label></p>
                <select name="provincia" required>
                    <option value="sanJose">San José</option>
                    <option value="alajuela">Alajuela</option>
                    <option value="cartago">Cartago</option>
                    <option value="heredia">Heredia</option>
                    <option value="puntarenas">Puntarenas</option>
                    <option value="limon">Limón</option>
                    <option value="guanacaste">Guanacaste</option>
                    <option value="noValido">No valido</option>
                </select>
 
                <p><label for="descripción">¿Cómo quiere presentarse?
                <textarea placeholder="Descripción" name="descripcion" required></textarea></label></p>
       
            </form>
 
        </div>
        </section>
 
    </main>

    <script src="../activos/js/script.js"></script>

</body>
</html>
